services:
  db:
    image: postgres:16
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: careercopilot
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d careercopilot"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7
    ports:
      - "6379:6379"

  backend:
    build: ./career-copilot-backend
    environment:
      DATABASE_URL: postgresql+psycopg://postgres:postgres@db:5432/careercopilot
      SECRET_KEY: ${SECRET_KEY:-development-only-change-before-deploying}
      AI_KEY: ${AI_KEY:-}
      ENV: ${APP_ENV:-dev}
      CORS_ORIGINS: http://localhost:3000,http://127.0.0.1:3000
      DD_AGENT_HOST: datadog-agent
      DD_SERVICE: career-copilot-backend
      DD_ENV: ${APP_ENV:-development}
      DD_VERSION: ${APP_VERSION:-0.1.0}
      DD_RUNTIME_METRICS_ENABLED: "true"
      DD_LOGS_INJECTION: "true"
      DD_DOGSTATSD_PORT: "8125"
      METRICS_ENABLED: ${METRICS_ENABLED:-false}
    ports:
      - "8000:8000"
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health/ready')"]
      interval: 10s
      timeout: 5s
      retries: 10

  frontend:
    build:
      context: ./career-copilot-frontend
      args:
        NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL:-http://127.0.0.1:8000}
    ports:
      - "3000:3000"
    depends_on:
      backend:
        condition: service_healthy

  datadog-agent:
    image: registry.datadoghq.com/agent:7
    profiles: ["observability"]
    environment:
      DD_API_KEY: ${DD_API_KEY:-}
      DD_SITE: ${DD_SITE:-datadoghq.com}
      DD_HOSTNAME: career-copilot-local
      DD_ENV: development
      DD_APM_ENABLED: "true"
      DD_APM_NON_LOCAL_TRAFFIC: "true"
      DD_DOGSTATSD_NON_LOCAL_TRAFFIC: "true"
      DD_DOGSTATSD_METRICS_STATS_ENABLE: "true"
      DD_PROCESS_CONFIG_PROCESS_COLLECTION_ENABLED: "true"
      DD_CONTAINER_EXCLUDE: "name:datadog-agent"
    ports:
      - "8126:8126"
      - "8125:8125/udp"
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
      - /proc/:/host/proc/:ro
      - /sys/fs/cgroup/:/host/sys/fs/cgroup:ro

volumes:
  pgdata:
